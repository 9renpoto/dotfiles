name: Self-hosted runner smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10

    steps:
      - name: Show runner information
        run: |
          uname -a
          sw_vers
          sysctl -n hw.logicalcpu
          sysctl -n hw.memsize

      - name: Check required tools
        run: |
          command -v git
          command -v gh
          command -v mise
