name: mise configuration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        run: |
          curl -fsSL https://mise.jdx.dev/install.sh -o /tmp/install-mise.sh
          MISE_VERSION=2026.10.19 sh /tmp/install-mise.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install test tools
        run: mise use --global go biome
      - name: Test with coverage
        run: mise exec -- go test ./... -coverprofile=coverage.out
      - name: Record coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error
      - name: Coverage summary
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          version: v0.83.1
          checksum: 8e9980e02a2713d0335d9928761b2bfa111c6f9ff879252dc2b11e0bd712e332
      - name: Record coverage badge artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: coverage.svg
          if-no-files-found: error
      - name: Check shell syntax
        run: |
          sh -n initialize.sh devcontainer-setup.sh scripts/integrate.sh scripts/setup-git-credentials.sh
          bash -n scripts/sync-skills.sh

  windows-native:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize Windows Go runtime
        run: |
          .\initialize.ps1 -SkipPackages -SkipApply
          $misePath = (Get-Command mise.exe -ErrorAction Stop).Source
          Split-Path -Parent $misePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh
      - name: Test on Windows
        run: mise exec -- go test ./...

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download coverage badge
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge
          path: public
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
