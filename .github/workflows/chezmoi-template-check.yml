name: chezmoi templates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate chezmoi configuration
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run chezmoi checks
        run: bash .devcontainer/scripts/check-chezmoi.sh
